# Festival PostgreSQL — client authentication (Git-managed)
#
# Mounted read-only over $PGDATA/pg_hba.conf (compose.yaml, postgres service).
# The official postgres:18 image's default pg_hba.conf leaves local/loopback
# connections (unix socket, 127.0.0.1/32, ::1/128) on "trust" and only
# appends a scram-sha-256 catch-all for other addresses. That means anyone
# who can reach the container's own loopback (e.g. `docker exec ... psql -h
# 127.0.0.1`) bypasses password checks entirely. This file requires
# scram-sha-256 everywhere, including local/loopback, while keeping every
# rule PostgreSQL ships by default (including replication) so normal
# operation is unaffected.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256
# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256
# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256
# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# Docker network (backend, db-tools, and any other service on the compose
# network) — password required for every other address too.
host    all             all             all                     scram-sha-256
